# download 브랜치에 실행 파일이 올라오면 GitHub Release "latest" 를 새로 만들고 파일을 Assets 로 붙인다.
# (tools/deploy_downloads.sh 가 이 파일을 download 브랜치의 .github/workflows/ 에 넣는다)
name: Release
on:
  push:
    branches: [download]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 최신 릴리스 다시 만들기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          files="demo-windows.zip demo-linux.tar.gz"
          if [ -f demo.apk ]; then files="$files demo.apk"; fi
          gh release create latest $files \
            --target "$GITHUB_SHA" \
            --title "demo 최신 버전 ($(cat VERSION))" \
            --notes-file NOTES.md \
            --latest
